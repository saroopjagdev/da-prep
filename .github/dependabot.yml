version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Held back on purpose (tested 3 Oct 2026): each breaks tooling we rely on.
      - dependency-name: eslint # 10 breaks eslint-config-next's React plugin
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript # 7 breaks typescript-eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node" # keep types on the Node 24 runtime major
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test" # 1.57 and later fail the e2e job (checked 4 Oct 2026: 1.61.1, 1.62.1, 1.63); stay on 1.56 until a fixed release
        versions: [">=1.57.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
